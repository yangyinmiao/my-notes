site_name: 技术笔记
site_description: 技术学习笔记
site_author: yangyinmiao
site_url: https://yangyinmiao.github.io/my-notes/
docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  language: zh
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - header.autohide
  icon:
    repo: fontawesome/brands/github
  repo_url: https://github.com/yangyinmiao
  repo_name: GitHub

extra:
  generator: false

extra_css:
  - assets/extra.css

plugins:
  - search:
      lang: zh
  - glightbox

nav:
  - 首页: index.md
  - AI Agent:
    - agent/index.md
    - 大模型基础:
      - LLM 基础: agent/00-foundations/00-llm基础.md
      - Embedding 与向量化: agent/00-foundations/01-embedding.md
      - 提示词工程: agent/00-foundations/02-提示词工程.md
      - 结构化输出: agent/00-foundations/03-结构化输出.md
      - 微调与 LoRA: agent/00-foundations/04-微调与LoRA.md
    - Agent 核心技术:
      - Function Call: agent/01-core/00-function-call.md
      - MCP: agent/01-core/01-mcp.md
      - RAG 技术: agent/01-core/02-rag.md
      - Context Engineering: agent/01-core/03-context-engineering.md
      - Agent 框架: agent/01-core/04-agent框架.md
      - Multi-Agent: agent/01-core/05-multi-agent.md
      - Agent Skill: agent/01-core/06-agent-skill.md
    - 工程实践:
      - 本地模型部署: agent/02-engineering/00-本地模型部署.md
      - n8n / Coze / Dify 对比: agent/02-engineering/01-n8n-coze-dify.md
      - Vibe Coding 技巧: agent/02-engineering/02-vibe-coding.md
    - 评估体系:
      - Harness Engineering: agent/03-evaluation/00-harness-engineering.md
      - Agent 性能评估: agent/03-evaluation/01-agent性能评估.md
    - 学习资源:
      - 论文: agent/04-resources/00-论文.md
  - 面试:
    - interview/00-overview.md
    - AI Agent 面试题: interview/01-AI-Agent面试题.md
    - 面试技巧: interview/02-面试技巧.md
  - 开发:
    - Python 基础: dev/python-basics.md
    - Python 并发: dev/python-concurrent.md
  - C 语言:
    - 指针: c-lang/pointers.md
  - 书籍推荐: 书籍推荐/intro.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: 目录
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
